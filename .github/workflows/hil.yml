name: Hardware in the Loop

on:
  workflow_dispatch:
    inputs:
      firmware_run_id:
        description: 'Successful main-branch ESP32-S3 Firmware CI run ID whose exact artifact should be flashed'
        required: true
        type: string
      board_revision:
        description: 'Physical Waveshare board revision'
        required: true
        default: 'v2'
        type: choice
        options:
          - v2
          - v1
      serial_port:
        description: 'Serial device visible to the self-hosted runner'
        required: true
        default: '/dev/ttyACM0'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  hil:
    name: Flash exact trusted CI artifact on Waveshare ${{ inputs.board_revision }} hardware
    runs-on: [self-hosted, linux, esp32-s3, waveshare-349b]
    timeout-minutes: 15

    steps:
      - name: Checkout trusted HIL harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Reject untrusted firmware workflow runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/validate_hil_run.py
          --run-id '${{ inputs.firmware_run_id }}'
          --repository '${{ github.repository }}'
          --output hil-source-run.json

      - name: Download exact firmware artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: esp32s3-firmware-${{ inputs.board_revision }}
          path: hil-firmware
          run-id: ${{ inputs.firmware_run_id }}
          github-token: ${{ github.token }}

      - name: Validate downloaded artifact provenance and digest
        run: >-
          python3 tools/validate_firmware_artifact.py
          --board '${{ inputs.board_revision }}'
          --image 'hil-firmware/asteroid-pilot-${{ inputs.board_revision }}-merged.bin'
          --manifest 'hil-firmware/firmware-manifest.json'
          --source-run hil-source-run.json

      - name: Install pinned HIL tools
        run: python3 -m pip install --user -r tools/requirements-hil.txt

      - name: Flash and verify exact merged binary
        run: >-
          python3 tools/flash_firmware.py
          --board '${{ inputs.board_revision }}'
          --port '${{ inputs.serial_port }}'
          --baud 921600
          --image 'hil-firmware/asteroid-pilot-${{ inputs.board_revision }}-merged.bin'
          --checksum-file 'hil-firmware/SHA256SUMS'
          --require-checksum

      - name: Validate boot and hardware diagnostics
        run: >-
          python3 tools/hil.py
          --port '${{ inputs.serial_port }}'
          --board '${{ inputs.board_revision }}'
          --timeout 45
          --report hil-report.json

      - name: Upload HIL evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hil-evidence-${{ inputs.board_revision }}
          if-no-files-found: warn
          path: |
            hil-report.json
            hil-source-run.json
            hil-firmware/firmware-manifest.json
            hil-firmware/SHA256SUMS
