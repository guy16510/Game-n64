name: Host CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native build (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select compiler
        shell: bash
        run: |
          if [[ "${{ matrix.compiler }}" == "clang" ]]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: cmake -S . -B build -DAP_BUILD_JET=ON -DAP_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Deterministic simulation
        run: ./build/ap_sim | tee build/simulation.json

      - name: Jet 640x172 smoke render
        run: ./build/ap_jet_smoke build/jet-smoke.ppm | tee build/jet-smoke.json

      - name: Upload native render evidence
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: native-render-evidence
          if-no-files-found: error
          path: |
            build/simulation.json
            build/jet-smoke.json
            build/jet-smoke.ppm

  sanitizers:
    name: Core sanitizers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure ASan + UBSan
        run: >-
          cmake -S . -B build-sanitize
          -DAP_BUILD_JET=OFF
          -DAP_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'

      - name: Build
        run: cmake --build build-sanitize --parallel

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
