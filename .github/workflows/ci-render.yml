name: Render Determinism

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure renderer
        run: cmake -S . -B build -DAP_BUILD_JET=ON -DAP_WARNINGS_AS_ERRORS=ON

      - name: Build renderer
        run: cmake --build build --target ap_jet_smoke --parallel

      - name: Render twice
        run: |
          ./build/ap_jet_smoke build/frame-a.ppm | tee build/frame-a.json
          ./build/ap_jet_smoke build/frame-b.ppm | tee build/frame-b.json

      - name: Require deterministic framebuffer
        run: |
          cmp build/frame-a.ppm build/frame-b.ppm
          sha256sum build/frame-a.ppm build/frame-b.ppm | tee build/render-sha256.txt

      - name: Require reviewed golden render
        shell: bash
        run: |
          actual="$(sha256sum build/frame-a.ppm | awk '{print $1}')"
          expected="$(awk '{print $1}' tests/golden/jet_smoke.sha256)"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"

      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: deterministic-render
          if-no-files-found: warn
          path: |
            build/frame-a.ppm
            build/frame-a.json
            build/frame-b.json
            build/render-sha256.txt
