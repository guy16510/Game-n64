name: ESP32-S3 Firmware CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: ESP-IDF 6.0.3 build (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [v1, v2]
    container:
      image: espressif/idf:v6.0.3@sha256:54278f2c01e6e759502e2f04c9103589c17528923426f4d63193490c7a08f555

    defaults:
      run:
        shell: bash

    env:
      AP_BOARD: ${{ matrix.board }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate host flashing and trust tools
        run: |
          python3 -m py_compile \
            tools/flash_firmware.py \
            tools/validate_merged.py \
            tools/hil.py \
            tools/make_firmware_manifest.py \
            tools/validate_hil_run.py \
            tools/validate_firmware_artifact.py \
            tools/test_hil_security.py
          python3 tools/test_hil_security.py

      - name: Configure ESP32-S3
        working-directory: firmware
        run: |
          source "$IDF_PATH/export.sh" >/dev/null
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.${AP_BOARD}.defaults" set-target esp32s3

      - name: Build firmware
        working-directory: firmware
        run: |
          source "$IDF_PATH/export.sh" >/dev/null
          idf.py build

      - name: Report image sizes
        working-directory: firmware
        run: |
          source "$IDF_PATH/export.sh" >/dev/null
          idf.py size

      - name: Produce single flashable image
        working-directory: firmware
        run: |
          source "$IDF_PATH/export.sh" >/dev/null
          idf.py merge-bin -o "asteroid-pilot-${AP_BOARD}-merged.bin" -f raw

      - name: Validate merged flash layout
        run: >-
          python3 tools/validate_merged.py
          --build-dir firmware/build
          --image "firmware/build/asteroid-pilot-${AP_BOARD}-merged.bin"

      - name: Record SHA256
        working-directory: firmware
        run: sha256sum "build/asteroid-pilot-${AP_BOARD}-merged.bin" | tee build/SHA256SUMS

      - name: Create firmware provenance manifest
        run: >-
          python3 tools/make_firmware_manifest.py
          --board "${AP_BOARD}"
          --image "firmware/build/asteroid-pilot-${AP_BOARD}-merged.bin"
          --output "firmware/build/firmware-manifest.json"
          --source-sha "${GITHUB_SHA}"
          --source-ref "${GITHUB_REF_NAME}"
          --workflow-run-id "${GITHUB_RUN_ID}"
          --idf-version "6.0.3"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: esp32s3-firmware-${{ matrix.board }}
          if-no-files-found: error
          path: |
            firmware/build/asteroid-pilot-${{ matrix.board }}-merged.bin
            firmware/build/SHA256SUMS
            firmware/build/firmware-manifest.json
            firmware/dependencies.lock
            firmware/build/asteroid_pilot_firmware.bin
            firmware/build/asteroid_pilot_firmware.elf
            firmware/build/asteroid_pilot_firmware.map
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
            firmware/build/flasher_args.json
            firmware/build/project_description.json
