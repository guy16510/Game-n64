name: ESP32-S3 Firmware CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: ESP-IDF 6.0.3 build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure ESP32-S3
        working-directory: firmware
        run: idf.py set-target esp32s3

      - name: Build firmware
        working-directory: firmware
        run: idf.py build

      - name: Report image sizes
        working-directory: firmware
        run: idf.py size

      - name: Produce single flashable image
        working-directory: firmware
        run: idf.py merge-bin -o asteroid-pilot-merged.bin -f raw

      - name: Record SHA256
        working-directory: firmware
        run: sha256sum build/asteroid-pilot-merged.bin | tee build/SHA256SUMS

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          if-no-files-found: error
          path: |
            firmware/build/asteroid-pilot-merged.bin
            firmware/build/SHA256SUMS
            firmware/build/asteroid_pilot_firmware.bin
            firmware/build/asteroid_pilot_firmware.elf
            firmware/build/asteroid_pilot_firmware.map
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
            firmware/build/project_description.json
